<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Products - Craftora</title>
  <link rel="stylesheet" href="./styles/style.css">
  <link rel="stylesheet" href="./styles/products.css">
</head>

<body>
  <main>
    <section class="section main-content">
      <div class="container">
        <h1>All Products</h1><br>
        <p>Browse our catalogue of high quality products <br> and Customize to your liking.</p>
      </div>
    </section>
    <section class="section">
      <div class="container topbar">
        <div class="search-wrap">
          <span class="search-icon">
            <?xml version="1.0" encoding="utf-8"?><!-- Uploaded to: SVG Repo, www.svgrepo.com, Generator: SVG Repo Mixer Tools -->
            <svg width="50px" height="50px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path fill-rule="evenodd" clip-rule="evenodd"
                d="M10 5C7.23858 5 5 7.23858 5 10C5 12.7614 7.23858 15 10 15C11.381 15 12.6296 14.4415 13.5355 13.5355C14.4415 12.6296 15 11.381 15 10C15 7.23858 12.7614 5 10 5ZM3 10C3 6.13401 6.13401 3 10 3C13.866 3 17 6.13401 17 10C17 11.5719 16.481 13.0239 15.6063 14.1921L20.7071 19.2929C21.0976 19.6834 21.0976 20.3166 20.7071 20.7071C20.3166 21.0976 19.6834 21.0976 19.2929 20.7071L14.1921 15.6063C13.0239 16.481 11.5719 17 10 17C6.13401 17 3 13.866 3 10Z"
                fill="#000000" />
            </svg>
          </span>
          <input id="searchInput" type="text" placeholder="Search products by name, category, or description..." />
        </div>

        <div class="category-wrap" aria-label="Category filters">
          <button class="category-btn active" type="button">All Category</button>
          <button class="category-btn" type="button">Diary</button>
          <button class="category-btn" type="button">Bottle</button>
          <button class="category-btn" type="button">Tshirt</button>
          <button class="category-btn" type="button">Cup</button>
        </div>
      </div>
    </section>
    <section class="product-section">
      <div class="container">
        <div id="productGrid" class="grid">
          <div class="product-card">
            <div class="product-card__badge">New Arrival</div>

            <div class="product-card__image-wrapper">
            </div>

            <div class="product-card__content">
              <div class="product-card__category">Apparel</div>

              <h4 class="product-card__title">
                Urban Oversized Tee
              </h4>

              <p class="product-card__description">
                Premium cotton t-shirt designed for all-day comfort and modern streetwear vibes.
              </p>

              <div class="product-card__footer">
                <span class="product-card__price">$49.00</span>

                <button class="product-card__button">
                  <span>Customize</span>

                  <!-- Customize Product Icon -->
                  <!-- Magic Pencil SVG -->
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <!-- Pencil -->
                    <path d="M12 20h9" />
                    <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />

                    <!-- Magic Sparkles -->
                    <path d="M18 2l.5 1.5L20 4l-1.5.5L18 6l-.5-1.5L16 4l1.5-.5Z" />
                    <path d="M5 3l.4 1.1L6.5 4.5l-1.1.4L5 6l-.4-1.1L3.5 4.5l1.1-.4Z" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

    </section>
  </main>
</body>

</html>
