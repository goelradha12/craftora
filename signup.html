<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - Craftora | Modern Custom Merchandize</title>

    <link rel="stylesheet" href="./styles/header.css">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/login.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <main class="login">

        <div class="login--image">
            <img src="./assets/t-shirt_blue_person.jpg" alt="Signup Banner">
        </div>

        <div class="login--form">

            <a href="./index.html" class="logo-link">
                <img src="./assets/logo.png" alt="Craftora Logo" class="logo-loginPage">
            </a>

            <h2>Signup</h2>

            <form id="signupForm">

                <!-- Email -->
                <div class="form-group">
                    <label for="email" class="required">Email Address</label>

                    <div class="input-with-icon">
                        <i class="fas fa-envelope" aria-hidden="true"></i>

                        <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email"
                            required>
                    </div>
                </div>

                <!-- Full Name -->
                <div class="form-group">
                    <label for="fullname" class="required">Full Name</label>

                    <div class="input-with-icon">
                        <i class="fas fa-user" aria-hidden="true"></i>

                        <input type="text" id="fullname" name="fullname" class="form-control"
                            placeholder="Enter your full name" required>
                    </div>
                </div>

                <!-- Address -->
                <div class="form-group">
                    <label for="address" class="">Full Address</label>

                    <div class="input-with-icon">
                        <i class="fas fa-location-dot" aria-hidden="true"></i>

                        <input type="text" id="address" name="address" class="form-control"
                            placeholder="Default Delivery Address">
                    </div>
                </div>

                <!-- Phone -->
                <div class="form-group">
                    <label for="phone" class="required">Phone Number</label>

                    <div class="input-with-icon">
                        <i class="fas fa-phone" aria-hidden="true"></i>

                        <input type="tel" id="phone" name="phone" class="form-control"
                            placeholder="Enter your phone number" required>
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password" class="required">Password</label>

                    <div class="input-with-icon">
                        <i class="fas fa-lock" aria-hidden="true"></i>

                        <input type="password" id="password" name="password" class="form-control"
                            placeholder="Enter your password" required>
                    </div>
                </div>

                <!-- Submit -->
                <button type="submit" class="submit-btn hero--btn">
                    Sign Up
                </button>

                <!-- Login Link -->
                <div class="signup-link">
                    Already have an account?
                    <a href="./login.html">Sign in here</a>
                </div>

            </form>

        </div>

    </main>

</body>

</html>
