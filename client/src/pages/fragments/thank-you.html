<main id="main-content">
        <div class="container">
            <div class="thankyou">
                <div class="thankyou__icon">
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
                </div>

                <h1 class="thankyou__heading">Thank You for Your Order!</h1>
                <p class="thankyou__message">We've received your order and will begin processing it shortly.</p>

                <div class="thankyou__details">
                    <div class="thankyou__detail-row">
                        <span class="thankyou__detail-label">Order ID</span>
                        <span class="thankyou__detail-value" id="orderIdText">#---</span>
                    </div>
                    <div class="thankyou__detail-row">
                        <span class="thankyou__detail-label">Estimated Delivery</span>
                        <span class="thankyou__detail-value">3 – 5 business days</span>
                    </div>
                    <div class="thankyou__detail-row">
                        <span class="thankyou__detail-label">Payment</span>
                        <span class="thankyou__detail-value">Confirmed</span>
                    </div>
                </div>

                <div class="thankyou__actions">
                    <a href="/products" class="thankyou__btn thankyou__btn--primary">Continue Shopping</a>
                    <a href="/account#my-orders" class="thankyou__btn thankyou__btn--secondary">View Orders</a>
                </div>
            </div>
        </div>
    </main>
