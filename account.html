<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - Craftora</title>
    <meta name="description" content="Manage your Craftora account details, orders, wishlist, and cart in one place.">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f2937'/%3E%3Cpath d='M20 24h24l-2 24H22l-2-24Z' fill='%23ffffff'/%3E%3Cpath d='M25 24c0-4 3-8 7-8s7 4 7 8' fill='none' stroke='%23ffffff' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M29 34h6' stroke='%231f2937' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M44 16l1.2 2.8L48 20l-2.8 1.2L44 24l-1.2-2.8L40 20l2.8-1.2L44 16Z' fill='%23f59e0b'/%3E%3C/svg%3E">

    <!-- Legacy shortcut icon -->
    <link rel="shortcut icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f2937'/%3E%3Cpath d='M20 24h24l-2 24H22l-2-24Z' fill='%23ffffff'/%3E%3Cpath d='M25 24c0-4 3-8 7-8s7 4 7 8' fill='none' stroke='%23ffffff' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M29 34h6' stroke='%231f2937' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M44 16l1.2 2.8L48 20l-2.8 1.2L44 24l-1.2-2.8L40 20l2.8-1.2L44 16Z' fill='%23f59e0b'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin="">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link rel="stylesheet" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lato:wght@400;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    
    <link rel="preload" as="image" href="./assets/logo.webp" fetchpriority="high">
    <link rel="stylesheet" href="./styles/tokens.css">
    <link rel="stylesheet" href="./styles/style.css">
    <style>
        .account-page {
            padding-block: 2rem 3rem;
            min-height: calc(100vh - var(--nav-height));
        }

        .account-grid {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 1.5rem;
            align-items: start;
        }

        .account-sidebar,
        .account-card {
            background: #fff;
            border: 1px solid rgba(17, 24, 39, 0.06);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
        }

        .account-sidebar {
            overflow: hidden;
            position: sticky;
            top: calc(var(--nav-height) + 1rem);
        }

        .account-sidebar__header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            padding: 1.75rem 1.5rem;
            text-align: center;
            background: linear-gradient(145deg, #111827, #1f2937);
        }

        .account-avatar {
            display: grid;
            place-items: center;
            width: 68px;
            height: 68px;
            border-radius: 999px;
            background: var(--accent);
            color: #fff;
            font-size: 1.5rem;
            font-weight: 800;
            border: 3px solid rgba(255, 255, 255, 0.15);
        }

        .account-sidebar__name {
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
        }

        .account-sidebar__email {
            color: rgba(255, 255, 255, 0.72);
            font-size: 0.85rem;
        }

        .account-sidebar__nav {
            list-style: none;
            margin: 0;
            padding: 0.65rem 0;
        }

        .account-sidebar__nav a,
        .account-sidebar__nav button {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            width: 100%;
            min-height: 46px;
            padding: 0.75rem 1.25rem;
            border: 0;
            border-left: 3px solid transparent;
            background: transparent;
            color: var(--text-primary);
            text-align: left;
            text-decoration: none;
            font: inherit;
            font-weight: 600;
            transition: background var(--transition-base), color var(--transition-base), border-color var(--transition-base);
        }

        .account-sidebar__nav a:hover,
        .account-sidebar__nav a.is-active,
        .account-sidebar__nav button:hover {
            background: rgba(255, 102, 9, 0.06);
            color: var(--accent);
            border-left-color: var(--accent);
        }

        .account-sidebar__nav svg {
            flex-shrink: 0;
        }

        .account-sidebar__divider {
            height: 1px;
            margin: 0.5rem 1.25rem;
            background: var(--border-default);
        }

        .nav-logout {
            color: #dc2626;
        }

        .account-main {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            min-width: 0;
        }

        .account-card {
            padding: 1.5rem;
        }

        .account-card__title {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            margin-bottom: 1.25rem;
            padding-bottom: 0.85rem;
            border-bottom: 1px solid var(--border-default);
            font-size: 1.1rem;
            font-weight: 700;
        }

        .account-card__title svg {
            color: var(--accent);
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1rem;
        }

        .info-field {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            min-width: 0;
        }

        .info-field--full {
            grid-column: 1 / -1;
        }

        .info-label {
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .info-value {
            display: flex;
            align-items: center;
            min-height: 44px;
            padding: 0.7rem 0.95rem;
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            background: var(--bg);
            color: var(--text-muted);
        }

        .info-value--empty {
            color: var(--text-muted);
        }

        #my-orders {
            content-visibility: auto;
            contain-intrinsic-size: 540px;
        }

        .orders-empty {
            display: grid;
            place-items: center;
            gap: 0.8rem;
            min-height: 220px;
            padding: 2rem;
            text-align: center;
            border: 1px dashed rgba(255, 102, 9, 0.25);
            border-radius: var(--radius-lg);
            background: linear-gradient(135deg, rgba(255, 102, 9, 0.05), rgba(37, 99, 235, 0.04));
        }

        .orders-empty p {
            max-width: 420px;
            color: var(--text-muted);
        }

        .btn-primary,
        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0.75rem 1.25rem;
            border-radius: var(--radius-md);
            text-decoration: none;
            font-weight: 700;
            transition: transform var(--transition-base), opacity var(--transition-base), border-color var(--transition-base);
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
        }

        .btn-secondary {
            border: 1px solid var(--border-default);
            color: var(--text-primary);
            background: #fff;
        }

        .orders-list {
            display: grid;
            gap: 1rem;
        }

        .order-card {
            border: 1px solid var(--border-default);
            border-radius: var(--radius-lg);
            background: linear-gradient(180deg, #fff, #fbfbfa);
            padding: 1.1rem;
        }

        .order-card__top {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            align-items: start;
            margin-bottom: 1rem;
        }

        .order-card__id {
            font-size: 1rem;
            font-weight: 800;
        }

        .order-card__meta {
            color: var(--text-muted);
            font-size: 0.88rem;
        }

        .order-status {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 108px;
            min-height: 34px;
            padding: 0.4rem 0.8rem;
            border-radius: 999px;
            background: rgba(16, 185, 129, 0.12);
            color: var(--color-success);
            font-size: 0.76rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .order-card__grid {
            display: grid;
            grid-template-columns: 1.55fr 1fr;
            gap: 1rem;
        }

        .order-items,
        .order-side {
            display: grid;
            gap: 0.85rem;
        }

        .order-item,
        .order-summary,
        .delivery-card {
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            background: #fff;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.85rem 0.95rem;
        }

        .order-item__name {
            font-size: 0.96rem;
            font-weight: 700;
        }

        .order-item__meta,
        .order-summary__row,
        .delivery-card p {
            color: var(--text-body);
            font-size: 0.88rem;
            opacity: 1;
        }

        .order-item__price {
            font-size: 0.92rem;
            font-weight: 800;
            color: var(--text-primary);
            white-space: nowrap;
        }

        .order-summary,
        .delivery-card {
            padding: 1rem;
        }

        .order-summary h3,
        .delivery-card h3 {
            margin-bottom: 0.75rem;
            font-size: 0.95rem;
        }

        .order-summary__row {
            display: flex;
            justify-content: space-between;
            gap: 0.75rem;
            margin-bottom: 0.55rem;
        }

        .order-summary__row:last-child {
            margin-bottom: 0;
            padding-top: 0.75rem;
            border-top: 1px solid var(--border-default);
            font-weight: 800;
        }

        .delivery-card p+p {
            margin-top: 0.45rem;
        }

        .account-guest {
            padding: 4rem 1.75rem;
            text-align: center;
        }

        .account-guest svg {
            margin: 0 auto 1rem;
            color: var(--text-muted);
        }

        .account-guest h1 {
            margin-bottom: 0.6rem;
            font-size: clamp(1.75rem, 3vw, 2.25rem);
            line-height: 1.1;
            color: var(--text-primary);
        }

        .account-guest p {
            max-width: 480px;
            margin: 0 auto 1.5rem;
            color: var(--text-muted);
        }

        .account-guest__actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.85rem;
        }

        /* ── Order Accordion Styling ── */
        .order-accordion {
            border: 1px solid var(--border-default);
            border-radius: var(--radius-lg);
            background: linear-gradient(180deg, #fff, #fbfbfa);
            margin-bottom: 1rem;
            overflow: hidden;
            transition: box-shadow var(--transition-base);
        }

        .order-accordion:focus-within {
            box-shadow: 0 0 0 2px var(--color-accent);
        }

        .order-summary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 1.5rem;
            cursor: pointer;
            list-style: none; /* Hide default triangle */
        }
        
        .order-summary-header::-webkit-details-marker {
            display: none;
        }

        .order-summary-header:hover {
            background: rgba(0, 0, 0, 0.02);
        }

        .order-summary-content {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .order-summary-main {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .order-id {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .order-date {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .order-summary-meta {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .order-total-amt {
            color: var(--color-primary);
            font-weight: 800;
        }

        .order-summary-status {
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }

        .order-status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 90px;
            padding: 0.35rem 0.75rem;
            border-radius: 999px;
            background: rgba(16, 185, 129, 0.12);
            color: var(--color-success);
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .accordion-icon {
            color: var(--text-muted);
            transition: transform var(--transition-base), color var(--transition-base);
        }

        .order-summary-header:hover .accordion-icon {
            color: var(--color-accent);
        }

        details[open] .accordion-icon {
            transform: rotate(180deg);
        }

        .order-accordion-body {
            padding: 0 1.5rem 1.5rem 1.5rem;
            border-top: 1px solid var(--border-default);
            margin-top: 0.5rem;
            padding-top: 1.5rem;
        }

        .order-details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .order-details-grid h3, .order-items-section h3 {
            font-size: 0.95rem;
            margin-bottom: 0.75rem;
            color: var(--text-primary);
            font-weight: 700;
            border-bottom: 1px solid var(--border-default);
            padding-bottom: 0.5rem;
        }

        .delivery-card p {
            margin: 0 0 0.45rem 0;
            color: var(--text-body);
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .order-summary__row {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--text-body);
            margin-bottom: 0.5rem;
        }

        .order-summary__row span:last-child {
            font-weight: 600;
            color: var(--text-primary);
        }

        .order-items-list {
            display: grid;
            gap: 1rem;
        }

        .order-item {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            padding: 1rem;
            background: #fff;
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
        }

        .order-item__img {
            border-radius: var(--radius-sm);
            object-fit: cover;
            border: 1px solid var(--border-default);
        }

        .order-item__info {
            flex: 1;
        }

        .order-item__name {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .order-item__meta {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .order-item__price {
            font-weight: 800;
            font-size: 1rem;
        }

        @media (max-width: 900px) {

            .account-grid,
            .order-card__grid {
                grid-template-columns: 1fr;
            }

            .account-sidebar {
                position: static;
            }
        }

        @media (max-width: 768px) {
            .container {
                width: min(92vw, 1200px);
            }

            .account-page {
                padding-top: 1.25rem;
            }

            .account-sidebar__header {
                flex-direction: row;
                text-align: left;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .order-card__top,
            .order-item {
                flex-direction: column;
            }

            .order-status {
                min-width: 0;
                width: fit-content;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            *,
            *::before,
            *::after {
                transition: none !important;
                animation: none !important;
            }
        }
    </style>
</head>

<body>
    <div id="header"></div>
    <main id="main-content" class="account-page">
        <div class="container">
            <section class="account-card account-guest" id="guestState" hidden>
                <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                    aria-hidden="true">
                    <circle cx="12" cy="8" r="4"></circle>
                    <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"></path>
                </svg>
                <h1>You're not signed in</h1>
                <p>Sign in to view your saved details, recent orders, wishlist, and cart activity in one place.</p>
                <div class="account-guest__actions">
                    <a href="./login.html" class="btn-primary">Sign In</a>
                    <a href="./signup.html" class="btn-secondary">Create Account</a>
                </div>
            </section>

            <div class="account-grid" id="accountState" hidden>
                <aside class="account-sidebar">
                    <div class="account-sidebar__header">
                        <div class="account-avatar" id="sidebarAvatar" aria-hidden="true"></div>
                        <div>
                            <p class="account-sidebar__name" id="sidebarName"></p>
                            <p class="account-sidebar__email" id="sidebarEmail"></p>
                        </div>
                    </div>
                    <ul class="account-sidebar__nav">
                        <li>
                            <a href="./account.html" class="is-active">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" aria-hidden="true">
                                    <circle cx="12" cy="8" r="4"></circle>
                                    <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"></path>
                                </svg>
                                My Account
                            </a>
                        </li>
                        <li>
                            <a href="#my-orders">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" aria-hidden="true">
                                    <path d="M9 12h6"></path>
                                    <path d="M9 16h6"></path>
                                    <path d="M9 8h6"></path>
                                    <rect x="4" y="3" width="16" height="18" rx="2"></rect>
                                </svg>
                                My Orders
                            </a>
                        </li>
                        <li>
                            <a href="./wishlist.html">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" aria-hidden="true">
                                    <path
                                        d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                                    </path>
                                </svg>
                                Wishlist
                            </a>
                        </li>
                        <li>
                            <a href="./cart.html">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" aria-hidden="true">
                                    <path
                                        d="M3 3H5L5.4 5M5.4 5H21L19 14H7.2M5.4 5L7.2 14M7.2 14L6 16.5C5.6 17.3 6.2 18 7 18H19M9 21C9 21.5523 8.55228 22 8 22C7.44772 22 7 21.5523 7 21C7 20.4477 7.44772 20 8 20C8.55228 20 9 20.4477 9 21ZM19 21C19 21.5523 18.5523 22 18 22C17.4477 22 17 21.5523 17 21C17 20.4477 17.4477 20 18 20C18.5523 20 19 20.4477 19 21Z"
                                        stroke-linecap="round" stroke-linejoin="round"></path>
                                </svg>
                                Cart
                            </a>
                        </li>
                        <li>
                            <div class="account-sidebar__divider"></div>
                        </li>
                        <li>
                            <button class="nav-logout js-logout-btn" type="button">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" aria-hidden="true">
                                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                    <polyline points="16 17 21 12 16 7"></polyline>
                                    <line x1="21" y1="12" x2="9" y2="12"></line>
                                </svg>
                                Sign Out
                            </button>
                        </li>
                    </ul>
                </aside>

                <div class="account-main">
                    <section class="account-card">
                        <h2 class="account-card__title">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" aria-hidden="true">
                                <circle cx="12" cy="8" r="4"></circle>
                                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"></path>
                            </svg>
                            Personal Information
                        </h2>
                        <div class="info-grid">
                            <div class="info-field">
                                <span class="info-label">Full Name</span>
                                <div class="info-value" id="infoName"></div>
                            </div>
                            <div class="info-field">
                                <span class="info-label">Email Address</span>
                                <div class="info-value" id="infoEmail"></div>
                            </div>
                            <div class="info-field">
                                <span class="info-label">Phone Number</span>
                                <div class="info-value" id="infoPhone"></div>
                            </div>
                            <div class="info-field">
                                <span class="info-label">Member Since</span>
                                <div class="info-value" id="infoJoined"></div>
                            </div>
                            <div class="info-field info-field--full">
                                <span class="info-label">Delivery Address</span>
                                <div class="info-value" id="infoAddress"></div>
                            </div>
                        </div>
                    </section>
                    <section class="account-card" id="my-orders">
                        <h2 class="account-card__title">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" aria-hidden="true">
                                <path d="M9 12h6"></path>
                                <path d="M9 16h6"></path>
                                <path d="M9 8h6"></path>
                                <rect x="4" y="3" width="16" height="18" rx="2"></rect>
                            </svg>
                            My Orders
                        </h2>
                        <div id="ordersState"></div>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <div id="footer"></div>
    <script src="./scripts/layout.js" defer></script>
    <script src="./scripts/account.js" defer></script>
</body>

</html>
