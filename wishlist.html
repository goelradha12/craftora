<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist - Craftora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/layout.css">
    <style>
        .wishlist-page {
            padding-block: 3rem;
            background: var(--bg);
            min-height: 60vh;
        }

        .wishlist-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .wishlist-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .wishlist-title svg { color: var(--accent); }

        .wishlist-count {
            font-size: 1rem;
            font-weight: 400;
            color: var(--color-muted);
        }

        .wishlist-clear-btn {
            background: none;
            border: 1.5px solid var(--color-border);
            color: var(--color-muted);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: border-color 0.2s ease, color 0.2s ease;
        }

        .wishlist-clear-btn:hover {
            border-color: #dc2626;
            color: #dc2626;
        }

        /* ── Grid ── */
        .wishlist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.5rem;
        }

        .wishlist-card {
            background: #fff;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 4px 20px hsl(from var(--primary) h s l / 0.08);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .wishlist-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 30px hsl(from var(--primary) h s l / 0.13);
        }

        .wishlist-card__img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: var(--bg);
        }

        /* Remove button overlay */
        .wishlist-card__remove {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #fff;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px hsl(from var(--primary) h s l / 0.15);
            color: #dc2626;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .wishlist-card__remove:hover {
            background: #fef2f2;
            transform: scale(1.1);
        }

        .wishlist-card__body {
            padding: 1.1rem;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            flex: 1;
        }

        .wishlist-card__category {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--accent);
            font-family: 'Inter', sans-serif;
        }

        .wishlist-card__name {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--primary);
            line-height: 1.3;
        }

        .wishlist-card__price {
            font-size: 1rem;
            font-weight: 800;
            color: var(--primary);
            margin-top: 0.15rem;
        }

        .wishlist-card__actions {
            display: flex;
            gap: 0.6rem;
            margin-top: 0.75rem;
        }

        .wishlist-card__btn-customize {
            flex: 1;
            padding: 0.6rem 0.75rem;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 0.5rem;
            font-size: 0.85rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: opacity 0.2s ease;
        }

        .wishlist-card__btn-customize:hover { opacity: 0.88; }

        /* ── Empty state ── */
        .wishlist-empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 5rem 2rem;
        }

        .wishlist-empty svg {
            color: var(--color-muted);
            margin-bottom: 1.25rem;
            opacity: 0.4;
        }

        .wishlist-empty h2 {
            display: block;
            font-size: 1.4rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .wishlist-empty h2::before,
        .wishlist-empty h2::after { display: none; }

        .wishlist-empty p {
            color: var(--color-muted);
            margin-bottom: 1.75rem;
        }

        .btn-primary {
            display: inline-block;
            padding: 0.8rem 2rem;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            border-radius: 0.5rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: opacity 0.2s ease;
        }

        .btn-primary:hover { opacity: 0.88; }

        /* Guest state */
        .wishlist-guest {
            text-align: center;
            padding: 5rem 2rem;
            background: #fff;
            border-radius: 1rem;
            box-shadow: 0 4px 20px hsl(from var(--primary) h s l / 0.07);
        }

        .wishlist-guest svg {
            color: var(--color-muted);
            margin-bottom: 1rem;
            opacity: 0.4;
        }

        .wishlist-guest h2 {
            display: block;
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
        }

        .wishlist-guest h2::before,
        .wishlist-guest h2::after { display: none; }

        .wishlist-guest p {
            color: var(--color-muted);
            margin-bottom: 1.5rem;
        }

        .wishlist-guest__actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-secondary {
            display: inline-block;
            padding: 0.8rem 2rem;
            background: #fff;
            color: var(--primary);
            text-decoration: none;
            border-radius: 0.5rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            border: 1.5px solid var(--color-border);
            transition: border-color 0.2s ease;
        }

        .btn-secondary:hover { border-color: var(--primary); }
    </style>
</head>

<body>
    <div id="header"></div>

    <main id="main-content" class="wishlist-page">
        <div class="container">

            <!-- Guest state -->
            <div class="wishlist-guest" id="guestState" hidden>
                <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                <h2>Sign in to see your wishlist</h2>
                <p>Save your favourite products and come back to them anytime.</p>
                <div class="wishlist-guest__actions">
                    <a href="./login.html" class="btn-primary">Sign In</a>
                    <a href="./products.html" class="btn-secondary">Browse Products</a>
                </div>
            </div>

            <!-- Logged in state -->
            <div id="wishlistState" hidden>
                <div class="wishlist-header">
                    <h1 class="wishlist-title">
                        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                        My Wishlist
                        <span class="wishlist-count" id="wishlistCount"></span>
                    </h1>
                    <button class="wishlist-clear-btn" id="clearAllBtn" aria-label="Clear all wishlist items">
                        Clear All
                    </button>
                </div>

                <div class="wishlist-grid" id="wishlistGrid" aria-live="polite"></div>
            </div>

        </div>
    </main>

    <div id="footer"></div>
    <script src="./scripts/layout.js" defer></script>
    <script src="./scripts/wishlist.js" defer></script>
</body>

</html>
