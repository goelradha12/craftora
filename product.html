<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Craftora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&display=swap"
        onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&display=swap">
    </noscript>

    <style>
        @font-face {
            font-family: 'Inter';
            font-display: swap;
            src: local('Inter');
        }

        @font-face {
            font-family: 'Lato';
            font-display: swap;
            src: local('Lato');
        }

        #product {
            min-height: 100vh;
        }
    </style>
    <link rel="stylesheet" href="./styles/tokens.css">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/product.css">
    <link rel="preload" href="./content/products.json" as="fetch" crossorigin="anonymous">
</head>

<body>
    <div id="header"></div>
    <main id="main-content">
        <div id="product" aria-live="polite" aria-busy="true" aria-label="Product details"></div>
    </main>
    <div id="footer"></div>
    <script src="./scripts/layout.js" defer></script>
    <script src="./scripts/product.js" defer></script>
    <script src="./scripts/design_preview.js" defer></script>
</body>

</html>
