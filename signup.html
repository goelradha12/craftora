<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Craftora | Modern Custom Merchandise</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f2937'/%3E%3Cpath d='M20 24h24l-2 24H22l-2-24Z' fill='%23ffffff'/%3E%3Cpath d='M25 24c0-4 3-8 7-8s7 4 7 8' fill='none' stroke='%23ffffff' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M29 34h6' stroke='%231f2937' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M44 16l1.2 2.8L48 20l-2.8 1.2L44 24l-1.2-2.8L40 20l2.8-1.2L44 16Z' fill='%23f59e0b'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin="">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link rel="stylesheet" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lato:wght@400;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="stylesheet" href="./styles/tokens.css">
    <link rel="stylesheet" href="./styles/typography.css">
    <link rel="stylesheet" href="./styles/components.css">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/login.css">
</head>

<body>
    <main class="login">

        <div class="login--image">
            <img loading="lazy" src="./assets/t-shirt_blue_person.webp" alt="Signup Banner" width="600" height="800">
        </div>

        <div class="login--form">

            <a href="./index.html" class="logo-link">
                <img src="./assets/logo.webp" alt="Craftora Logo" class="logo-loginPage" width="116" height="24">
            </a>

            <div class="login-heading">
                <h2>Create Account</h2>
                <p class="login-subtitle">Join Craftora and start designing your own merch.</p>
            </div>

            <div class="form-error-banner" id="signupError" role="alert" hidden>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span id="signupErrorMsg"></span>
            </div>

            <form id="signupForm" novalidate>

                <div class="form-group">
                    <label for="fullname" class="required">Full Name</label>
                    <div class="input-with-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" class="input-icon"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                        <input type="text" id="fullname" name="fullname" class="form-control"
                               placeholder="Your full name" autocomplete="name" required>
                    </div>
                    <span class="field-error" id="nameError"></span>
                </div>

                <div class="form-group">
                    <label for="phone" class="required">Phone Number</label>
                    <div class="input-with-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" class="input-icon"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.62 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 8.91a16 16 0 0 0 5.61 5.61l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                        <input type="tel" id="phone" name="phone" class="form-control"
                               placeholder="10-digit mobile number"
                               autocomplete="tel" inputmode="numeric"
                               minlength="10" maxlength="10" pattern="[0-9]{10}" required>
                    </div>
                    <span class="field-error" id="phoneError"></span>
                </div>

                <div class="form-row-2">
                    <div class="form-group">
                        <label for="password" class="required">Password</label>
                        <div class="input-with-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" class="input-icon"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                            <input type="password" id="password" name="password" class="form-control"
                                   placeholder="Min. 6 characters" autocomplete="new-password" required minlength="6">
                            <button type="button" class="eye-toggle" id="togglePassword" aria-label="Show password">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" id="eyeIcon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            </button>
                        </div>
                        <span class="field-error" id="passwordError"></span>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword" class="required">Confirm Password</label>
                        <div class="input-with-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" class="input-icon"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
                                   placeholder="Re-enter password" autocomplete="new-password" required minlength="6">
                        </div>
                        <span class="field-error" id="confirmPasswordError"></span>
                    </div>
                </div>

                <ul class="pw-requirements" id="pwRequirements" aria-live="polite" aria-label="Password requirements">
                    <li data-rule="length"><span class="pw-req__icon">&#x25CB;</span> Minimum 6 characters</li>
                </ul>

                <div class="form-step__actions">
                    <button type="submit" class="submit-btn" id="signupBtn">
                        <span class="btn-text">
                            Create Account
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                        </span>
                        <svg class="btn-spinner" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg>
                    </button>
                </div>

                <div class="signup-link">
                    Already have an account?
                    <a href="./login.html">Sign in here</a>
                </div>
            </form>

        </div>

    </main>

    <script defer src="./scripts/auth.js"></script>
    <script>
        const _signupParams = new URLSearchParams(window.location.search);
        const _signupRedirect = _signupParams.get('redirect') || './index.html';

        const _loginLink = document.querySelector('a[href="./login.html"]');
        if (_loginLink && _signupParams.get('redirect')) {
            _loginLink.href = './login.html?redirect=' + encodeURIComponent(_signupParams.get('redirect'));
        }

        function validateForm() {
            var name = document.getElementById('fullname').value.trim();
            var phone = document.getElementById('phone').value.trim();
            var password = document.getElementById('password').value;
            var confirmPassword = document.getElementById('confirmPassword').value;

            ['nameError', 'phoneError', 'passwordError', 'confirmPasswordError'].forEach(function(id) {
                document.getElementById(id).textContent = '';
            });

            var valid = true;

            if (!name) {
                document.getElementById('nameError').textContent = 'Full name is required.';
                valid = false;
            }

            if (!phone) {
                document.getElementById('phoneError').textContent = 'Phone number is required.';
                valid = false;
            } else if (!isValidPhone(phone)) {
                document.getElementById('phoneError').textContent = 'Enter a valid 10-digit mobile number starting with 6-9.';
                valid = false;
            }

            if (!password) {
                document.getElementById('passwordError').textContent = 'Password is required.';
                valid = false;
            } else if (password.length < 6) {
                document.getElementById('passwordError').textContent = 'Password must be at least 6 characters.';
                valid = false;
            }

            if (!confirmPassword) {
                document.getElementById('confirmPasswordError').textContent = 'Please confirm your password.';
                valid = false;
            } else if (password !== confirmPassword) {
                document.getElementById('confirmPasswordError').textContent = 'Passwords do not match.';
                valid = false;
            }

            return valid;
        }

        document.getElementById('togglePassword').addEventListener('click', function() {
            var input = document.getElementById('password');
            var icon = document.getElementById('eyeIcon');
            var show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            icon.innerHTML = show
                ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>'
                : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
            document.getElementById('togglePassword').setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        });

        var pwInput = document.getElementById('password');
        var confirmPwInput = document.getElementById('confirmPassword');
        var pwReqList = document.getElementById('pwRequirements');
        var pwWrapper = pwInput.closest('.input-with-icon');

        pwWrapper.addEventListener('focusin', function() {
            pwReqList.classList.add('active');
        });
        pwWrapper.addEventListener('focusout', function(e) {
            if (!pwWrapper.contains(e.relatedTarget)) {
                pwReqList.classList.remove('active');
            }
        });

        pwInput.addEventListener('input', function() {
            var pw = pwInput.value;
            var results = validatePassword(pw).results;

            results.forEach(function(r) {
                var li = pwReqList.querySelector('[data-rule="' + r.id + '"]');
                if (!li) return;
                var icon = li.querySelector('.pw-req__icon');
                if (r.passed) {
                    li.classList.add('passed');
                    icon.textContent = '\u2713';
                } else {
                    li.classList.remove('passed');
                    icon.textContent = '\u25CB';
                }
            });

            pwReqList.classList.toggle('all-passed', results.every(function(r) { return r.passed; }));

            if (confirmPwInput.value && confirmPwInput.value === pw) {
                document.getElementById('confirmPasswordError').textContent = '';
            }
        });

        confirmPwInput.addEventListener('input', function() {
            var errEl = document.getElementById('confirmPasswordError');
            if (confirmPwInput.value && confirmPwInput.value !== pwInput.value) {
                errEl.textContent = 'Passwords do not match.';
            } else {
                errEl.textContent = '';
            }
        });

        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();

            if (!validateForm()) return;

            var name = document.getElementById('fullname').value.trim();
            var phone = document.getElementById('phone').value.trim();
            var password = document.getElementById('password').value;

            var errorDiv = document.getElementById('signupError');
            var errorMsg = document.getElementById('signupErrorMsg');
            var btn = document.getElementById('signupBtn');

            errorDiv.hidden = true;
            btn.classList.add('loading');
            btn.disabled = true;

            setTimeout(function() {
                var result = attemptSignup({
                    name: name,
                    phone: phone,
                    email: '',
                    address: '',
                    addressObj: {},
                    password: password
                });

                btn.classList.remove('loading');
                btn.disabled = false;

                if (result.ok) {
                    window.location.href = _signupRedirect;
                } else {
                    errorMsg.textContent = result.error;
                    errorDiv.hidden = false;
                }
            }, 400);
        });
    </script>
</body>
</html>
