<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - Craftora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/style.css">
    <style>
        .account-page {
            padding-block: 3rem;
            background: var(--bg);
            min-height: 60vh;
        }

        .account-grid {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 2rem;
            align-items: start;
        }

        /* ── Sidebar ── */
        .account-sidebar {
            background: #fff;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 4px 20px hsl(from var(--primary) h s l / 0.07);
        }

        .account-sidebar__header {
            background: var(--primary);
            padding: 1.75rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            text-align: center;
        }

        .account-avatar {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            font-size: 1.6rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 3px solid rgba(255,255,255,0.2);
        }

        .account-sidebar__name {
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            margin: 0;
        }

        .account-sidebar__email {
            color: rgba(255,255,255,0.65);
            font-size: 0.8rem;
            font-family: 'Lato', sans-serif;
        }

        .account-sidebar__nav {
            list-style: none;
            padding: 0.5rem 0;
        }

        .account-sidebar__nav li a,
        .account-sidebar__nav li button {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            width: 100%;
            padding: 0.75rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            color: var(--primary);
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
            text-align: left;
            transition: background 0.15s ease, color 0.15s ease;
            border-left: 3px solid transparent;
        }

        .account-sidebar__nav li a:hover,
        .account-sidebar__nav li button:hover {
            background: var(--bg);
            color: var(--accent);
            border-left-color: var(--accent);
        }

        .account-sidebar__nav li a.active {
            background: hsl(from var(--accent) h s l / 0.07);
            color: var(--accent);
            border-left-color: var(--accent);
            font-weight: 700;
        }

        .account-sidebar__nav li a svg,
        .account-sidebar__nav li button svg {
            color: var(--color-muted);
            flex-shrink: 0;
        }

        .account-sidebar__nav li a:hover svg,
        .account-sidebar__nav li button:hover svg,
        .account-sidebar__nav li a.active svg {
            color: var(--accent);
        }

        .account-sidebar__divider {
            height: 1px;
            background: var(--color-border);
            margin: 0.4rem 1.5rem;
        }

        .nav-logout {
            color: #dc2626 !important;
        }

        .nav-logout:hover {
            background: hsl(0 80% 97%) !important;
            color: #b91c1c !important;
            border-left-color: #dc2626 !important;
        }

        .nav-logout svg {
            color: #dc2626 !important;
        }

        /* ── Main content ── */
        .account-main {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .account-card {
            background: #fff;
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 4px 20px hsl(from var(--primary) h s l / 0.07);
        }

        .account-card__title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid var(--color-border);
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .account-card__title svg {
            color: var(--accent);
        }

        /* Info rows */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
        }

        .info-field {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .info-field--full {
            grid-column: 1 / -1;
        }

        .info-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--color-muted);
            font-family: 'Inter', sans-serif;
        }

        .info-value {
            font-size: 0.95rem;
            color: var(--primary);
            font-family: 'Lato', sans-serif;
            padding: 0.6rem 0.9rem;
            background: var(--bg);
            border-radius: 0.5rem;
            border: 1px solid var(--color-border);
            min-height: 2.5rem;
            display: flex;
            align-items: center;
        }

        .info-value--empty {
            color: var(--color-muted);
            font-style: italic;
        }

        /* Quick links */
        .quick-links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
        }

        .quick-link-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
            padding: 1.25rem 1rem;
            background: var(--bg);
            border-radius: 0.75rem;
            text-decoration: none;
            color: var(--primary);
            border: 1.5px solid var(--color-border);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
            text-align: center;
        }

        .quick-link-card:hover {
            border-color: var(--accent);
            box-shadow: 0 4px 16px hsl(from var(--accent) h s l / 0.15);
            transform: translateY(-2px);
        }

        .quick-link-card svg {
            color: var(--accent);
        }

        .quick-link-card span {
            font-size: 0.85rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
        }

        /* Not logged in state */
        .account-guest {
            text-align: center;
            padding: 4rem 2rem;
        }

        .account-guest svg {
            color: var(--color-muted);
            margin-bottom: 1rem;
        }

        .account-guest h2 {
            display: block;
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
        }

        .account-guest h2::before,
        .account-guest h2::after { display: none; }

        .account-guest p {
            color: var(--color-muted);
            margin-bottom: 1.5rem;
        }

        .account-guest__actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-primary {
            padding: 0.75rem 1.75rem;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            border-radius: 0.5rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: opacity 0.2s ease;
        }

        .btn-primary:hover { opacity: 0.88; }

        .btn-secondary {
            padding: 0.75rem 1.75rem;
            background: #fff;
            color: var(--primary);
            text-decoration: none;
            border-radius: 0.5rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            border: 1.5px solid var(--color-border);
            transition: border-color 0.2s ease;
        }

        .btn-secondary:hover { border-color: var(--primary); }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .account-grid {
                grid-template-columns: 1fr;
            }

            .account-sidebar {
                display: flex;
                flex-direction: column;
            }

            .account-sidebar__header {
                flex-direction: row;
                text-align: left;
                gap: 1rem;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div id="header"></div>

    <main id="main-content" class="account-page">
        <div class="container">

            <!-- Guest state (hidden when logged in) -->
            <div class="account-card account-guest" id="guestState" hidden>
                <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                <h2>You're not signed in</h2>
                <p>Sign in to view and manage your account details.</p>
                <div class="account-guest__actions">
                    <a href="./login.html" class="btn-primary">Sign In</a>
                    <a href="./signup.html" class="btn-secondary">Create Account</a>
                </div>
            </div>

            <!-- Logged in state -->
            <div class="account-grid" id="accountState" hidden>

                <!-- Sidebar -->
                <aside class="account-sidebar">
                    <div class="account-sidebar__header">
                        <div class="account-avatar" id="sidebarAvatar" aria-hidden="true"></div>
                        <div>
                            <p class="account-sidebar__name" id="sidebarName"></p>
                            <p class="account-sidebar__email" id="sidebarEmail"></p>
                        </div>
                    </div>
                    <ul class="account-sidebar__nav">
                        <li>
                            <a href="./account.html" class="active">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                                My Account
                            </a>
                        </li>
                        <li>
                            <a href="./wishlist.html">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                                Wishlist
                            </a>
                        </li>
                        <li>
                            <a href="./cart.html">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 3H5L5.4 5M5.4 5H21L19 14H7.2M5.4 5L7.2 14M7.2 14L6 16.5C5.6 17.3 6.2 18 7 18H19M9 21C9 21.5523 8.55228 22 8 22C7.44772 22 7 21.5523 7 21C7 20.4477 7.44772 20 8 20C8.55228 20 9 20.4477 9 21ZM19 21C19 21.5523 18.5523 22 18 22C17.4477 22 17 21.5523 17 21C17 20.4477 17.4477 20 18 20C18.5523 20 19 20.4477 19 21Z" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                Cart
                            </a>
                        </li>
                        <li><div class="account-sidebar__divider"></div></li>
                        <li>
                            <button class="nav-logout js-logout-btn">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                                Sign Out
                            </button>
                        </li>
                    </ul>
                </aside>

                <!-- Main -->
                <div class="account-main">

                    <!-- Personal Info -->
                    <div class="account-card">
                        <h2 class="account-card__title">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                            Personal Information
                        </h2>
                        <div class="info-grid">
                            <div class="info-field">
                                <span class="info-label">Full Name</span>
                                <div class="info-value" id="infoName"></div>
                            </div>
                            <div class="info-field">
                                <span class="info-label">Email Address</span>
                                <div class="info-value" id="infoEmail"></div>
                            </div>
                            <div class="info-field">
                                <span class="info-label">Phone Number</span>
                                <div class="info-value" id="infoPhone"></div>
                            </div>
                            <div class="info-field">
                                <span class="info-label">Member Since</span>
                                <div class="info-value" id="infoJoined"></div>
                            </div>
                            <div class="info-field info-field--full">
                                <span class="info-label">Delivery Address</span>
                                <div class="info-value" id="infoAddress"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Quick links -->
                    <div class="account-card">
                        <h2 class="account-card__title">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
                            Quick Links
                        </h2>
                        <div class="quick-links">
                            <a href="./products.html" class="quick-link-card">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
                                <span>Shop Now</span>
                            </a>
                            <a href="./wishlist.html" class="quick-link-card">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                                <span>My Wishlist</span>
                            </a>
                            <a href="./cart.html" class="quick-link-card">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 3H5L5.4 5M5.4 5H21L19 14H7.2M5.4 5L7.2 14M7.2 14L6 16.5C5.6 17.3 6.2 18 7 18H19M9 21C9 21.5523 8.55228 22 8 22C7.44772 22 7 21.5523 7 21C7 20.4477 7.44772 20 8 20C8.55228 20 9 20.4477 9 21ZM19 21C19 21.5523 18.5523 22 18 22C17.4477 22 17 21.5523 17 21C17 20.4477 17.4477 20 18 20C18.5523 20 19 20.4477 19 21Z" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                <span>View Cart</span>
                            </a>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </main>

    <div id="footer"></div>
    <script src="./scripts/layout.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const raw = localStorage.getItem('craftora_user');
            const user = raw ? JSON.parse(raw) : null;

            if (!user) {
                document.getElementById('guestState').hidden = false;
                return;
            }

            document.getElementById('accountState').hidden = false;

            // Sidebar
            const initials = (user.name || user.email || '?')
                .split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
            document.getElementById('sidebarAvatar').textContent = initials;
            document.getElementById('sidebarName').textContent   = user.name  || '—';
            document.getElementById('sidebarEmail').textContent  = user.email || '—';

            // Info fields
            const empty = (v) => v
                ? `<span>${v}</span>`
                : `<span class="info-value--empty">Not provided</span>`;

            document.getElementById('infoName').innerHTML    = empty(user.name);
            document.getElementById('infoEmail').innerHTML   = empty(user.email);
            document.getElementById('infoPhone').innerHTML   = empty(user.phone);
            document.getElementById('infoAddress').innerHTML = empty(user.address);

            // Member since — store a joined date on first signup if present, otherwise show today
            const joined = user.joinedAt
                ? new Date(user.joinedAt).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })
                : 'Member';
            document.getElementById('infoJoined').innerHTML = `<span>${joined}</span>`;
        });
    </script>
</body>

</html>
