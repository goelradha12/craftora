<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Craftora | Modern Custom Merchandise</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f2937'/%3E%3Cpath d='M20 24h24l-2 24H22l-2-24Z' fill='%23ffffff'/%3E%3Cpath d='M25 24c0-4 3-8 7-8s7 4 7 8' fill='none' stroke='%23ffffff' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M29 34h6' stroke='%231f2937' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M44 16l1.2 2.8L48 20l-2.8 1.2L44 24l-1.2-2.8L40 20l2.8-1.2L44 16Z' fill='%23f59e0b'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin="">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link rel="stylesheet" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lato:wght@400;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="stylesheet" href="./styles/tokens.css">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/login.css">
</head>

<body>

    <main class="login">

        <!-- Left Image -->
        <div class="login--image">
            <img loading="lazy" src="./assets/t-shirt_blue_person.webp" alt="Person wearing custom t-shirt" width="600" height="800">
        </div>

        <!-- Login Form -->
        <div class="login--form">

            <a href="./index.html" class="logo-link">
                <img src="./assets/logo.webp" alt="Craftora Logo" class="logo-loginPage" width="116" height="24">
            </a>

            <h2 class="section-heading">Welcome Back!</h2>

            <!-- Error banner -->
            <div class="form-error-banner" id="loginError" role="alert" hidden>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span id="loginErrorMsg"></span>
            </div>

            <form id="loginForm" novalidate>

                <!-- Phone -->
                <div class="form-group">
                    <label for="phone" class="required">Phone Number</label>
                    <div class="input-with-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position:absolute;left:16px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--text-icon-muted)"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.62 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 8.91a16 16 0 0 0 5.61 5.61l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                        <input type="tel" id="phone" name="phone" class="form-control"
                               placeholder="Enter your 10-digit number"
                               autocomplete="tel" inputmode="numeric"
                               minlength="10" maxlength="10" pattern="[0-9]{10}" required>
                    </div>
                    <span class="field-error" id="phoneError"></span>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password" class="required">Password</label>
                    <div class="input-with-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position:absolute;left:16px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--text-icon-muted)"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="password" id="password" name="password" class="form-control"
                               placeholder="Enter your password" autocomplete="current-password" required>
                        <button type="button" class="eye-toggle" id="togglePassword" aria-label="Show password">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" id="eyeIcon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                    <span class="field-error" id="passwordError"></span>
                </div>

                <!-- Submit -->
                <button type="submit" class="submit-btn" id="loginBtn">
                    <span class="btn-text">Sign In</span>
                    <svg class="btn-spinner" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg>
                </button>

                <!-- Signup Link -->
                <div class="signup-link">
                    Don't have an account?
                    <a href="./signup.html">Sign up here</a>
                </div>

            </form>

        </div>

    </main>

    <script defer src="./scripts/auth.js"></script>
    <script>
        /* ── Redirect params ── */
        const _loginParams = new URLSearchParams(window.location.search);
        const _loginRedirect = _loginParams.get('redirect') || './index.html';

        const _signupLink = document.querySelector('a[href="./signup.html"]');
        if (_signupLink && _loginParams.get('redirect')) {
            _signupLink.href = `./signup.html?redirect=${encodeURIComponent(_loginParams.get('redirect'))}`;
        }

        /* ── Toggle password visibility ── */
        document.getElementById('togglePassword').addEventListener('click', () => {
            const input = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            // Swap icon between eye and eye-off
            icon.innerHTML = show
                ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>'
                : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
            document.getElementById('togglePassword').setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        });

        /* ── Form submit ── */
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');
            const errorMsg = document.getElementById('loginErrorMsg');
            const btn = document.getElementById('loginBtn');

            errorDiv.hidden = true;
            document.getElementById('phoneError').textContent = '';
            document.getElementById('passwordError').textContent = '';

            let valid = true;
            if (!phone) {
                document.getElementById('phoneError').textContent = 'Phone number is required.';
                valid = false;
            } else if (!isValidPhone(phone)) {
                document.getElementById('phoneError').textContent = 'Enter a valid 10-digit mobile number.';
                valid = false;
            }
            if (!password) {
                document.getElementById('passwordError').textContent = 'Password is required.';
                valid = false;
            }
            if (!valid) return;

            btn.classList.add('loading');
            btn.disabled = true;

            setTimeout(() => {
                const result = attemptLogin(phone, password);
                btn.classList.remove('loading');
                btn.disabled = false;

                if (result.ok) {
                    window.location.href = _loginRedirect;
                } else {
                    errorMsg.textContent = result.error;
                    errorDiv.hidden = false;
                }
            }, 400);
        });
    </script>

</body>
</html>
