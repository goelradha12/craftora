<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Craftora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/tokens.css">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/cart.css">
</head>

<body>
    <div id="header"></div>

    <main id="main-content" class="cart-page">
        <h1 class="cart-title">Your Cart</h1>

        <div class="cart-layout">
            <div class="cart-items-container" id="cartItemsContainer" aria-live="polite">
            </div>

            <aside class="cart-summary">
                <h2 class="summary-title">Order Summary</h2>

                <div class="summary-row">
                    <span>Items (<span id="summaryItemCount">0</span>)</span>
                    <span id="summarySubtotal">₹0</span>
                </div>
                <div class="summary-row">
                    <span>Shipping</span>
                    <span>Free</span>
                </div>

                <div class="summary-divider"></div>

                <div class="summary-row summary-total">
                    <span>Total</span>
                    <span id="summaryTotal">₹0</span>
                </div>

                <button class="checkout-btn" id="checkoutBtn" disabled>
                    Proceed to Checkout
                </button>
            </aside>
        </div>
    </main>

    <div id="footer"></div>
    <script src="./scripts/layout.js" defer></script>
    <script src="./scripts/cart.js" defer></script>
</body>

</html>
