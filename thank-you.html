<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed - Craftora</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f2937'/%3E%3Cpath d='M20 24h24l-2 24H22l-2-24Z' fill='%23ffffff'/%3E%3Cpath d='M25 24c0-4 3-8 7-8s7 4 7 8' fill='none' stroke='%23ffffff' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M29 34h6' stroke='%231f2937' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M44 16l1.2 2.8L48 20l-2.8 1.2L44 24l-1.2-2.8L40 20l2.8-1.2L44 16Z' fill='%23f59e0b'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin="">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link rel="stylesheet" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lato:wght@400;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="stylesheet" href="./styles/tokens.css">
    <link rel="stylesheet" href="./styles/typography.css">
    <link rel="stylesheet" href="./styles/components.css">
    <link rel="stylesheet" href="./styles/style.css">
    <style>
        .thankyou {
            text-align: center;
            padding: var(--space-16) var(--space-4);
            max-width: 520px;
            margin: 0 auto;
        }

        .thankyou__icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--color-success-light);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: var(--space-6);
        }

        .thankyou__heading {
            font-family: var(--font-display);
            font-size: var(--text-2xl);
            font-weight: var(--weight-normal);
            color: var(--text-primary);
            margin: 0 0 var(--space-3);
        }

        .thankyou__message {
            color: var(--text-muted);
            font-size: var(--text-base);
            line-height: var(--leading-relaxed);
            margin: 0 0 var(--space-8);
        }

        .thankyou__details {
            background: var(--surface-warm);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-xl);
            padding: var(--space-5) var(--space-6);
            margin-bottom: var(--space-8);
            text-align: left;
        }

        .thankyou__detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-2) 0;
            font-size: var(--text-sm);
            color: var(--text-body);
        }

        .thankyou__detail-row + .thankyou__detail-row {
            border-top: 1px solid var(--border-default);
        }

        .thankyou__detail-label {
            color: var(--text-muted);
        }

        .thankyou__detail-value {
            font-weight: var(--weight-semibold);
            color: var(--text-primary);
        }

        .thankyou__actions {
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
            align-items: center;
        }

        .thankyou__btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
            width: 100%;
            max-width: 280px;
            padding: 0.85rem 1.5rem;
            border-radius: var(--radius-lg);
            font-size: var(--text-base);
            font-weight: var(--weight-bold);
            font-family: var(--font-heading);
            text-decoration: none;
            cursor: pointer;
            transition: all var(--transition-base);
            border: 1.5px solid transparent;
        }

        .thankyou__btn--primary {
            background: var(--color-accent);
            color: #fff;
            border-color: var(--color-accent);
        }

        .thankyou__btn--primary:hover {
            background: var(--color-accent-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-accent);
        }

        .thankyou__btn--secondary {
            background: var(--surface-page);
            color: var(--text-primary);
            border-color: var(--border-default);
        }

        .thankyou__btn--secondary:hover {
            border-color: var(--color-primary);
            background: var(--surface-alt);
        }

        .thankyou__btn--ghost {
            background: transparent;
            color: var(--text-muted);
            border-color: transparent;
        }

        .thankyou__btn--ghost:hover {
            color: var(--text-primary);
            background: var(--surface-alt);
        }

        @media (max-width: 600px) {
            .thankyou {
                padding: var(--space-10) var(--space-4);
            }

            .thankyou__heading {
                font-size: var(--text-xl);
            }

            .thankyou__btn {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>
    <div id="header"></div>

    <main id="main-content">
        <div class="container">
            <div class="thankyou">
                <div class="thankyou__icon">
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
                </div>

                <h1 class="thankyou__heading">Thank You for Your Order!</h1>
                <p class="thankyou__message">We've received your order and will begin processing it shortly.</p>

                <div class="thankyou__details">
                    <div class="thankyou__detail-row">
                        <span class="thankyou__detail-label">Order ID</span>
                        <span class="thankyou__detail-value" id="orderIdText">#---</span>
                    </div>
                    <div class="thankyou__detail-row">
                        <span class="thankyou__detail-label">Estimated Delivery</span>
                        <span class="thankyou__detail-value">3 – 5 business days</span>
                    </div>
                    <div class="thankyou__detail-row">
                        <span class="thankyou__detail-label">Payment</span>
                        <span class="thankyou__detail-value">Confirmed</span>
                    </div>
                </div>

                <div class="thankyou__actions">
                    <a href="./products.html" class="thankyou__btn thankyou__btn--primary">Continue Shopping</a>
                    <a href="./account.html#my-orders" class="thankyou__btn thankyou__btn--secondary">View Orders</a>
                </div>
            </div>
        </div>
    </main>

    <div id="footer"></div>
    <script src="./scripts/layout.js" defer></script>
    <script>
        var params = new URLSearchParams(window.location.search);
        var orderId = params.get('orderId') || localStorage.getItem('lastOrderId') || 'N/A';
        document.getElementById('orderIdText').textContent = '#' + orderId;
    </script>
</body>

</html>
