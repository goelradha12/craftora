<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - Craftora | Modern Custom Merchandize</title>
    <link rel="stylesheet" href="./styles/header.css">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/login.css">
</head>
<body>
    <main class="login">
        <div class="login--image">
            <img src="./assets/t-shirt_blue_person.jpg" alt="">
        </div>
        <div class="login--form">
            <!-- <img src="./assets/logo.png" alt="Craftora Logo" class="logo-loginPage"> -->
            <h2>Signup</h2>
            <form id="signupForm">
                <title>Signup</title>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-with-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="email">Full Name</label>
                    <div class="input-with-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" class="form-control" placeholder="Enter your full name" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="email">Full Address</label>
                    <div class="input-with-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" class="form-control" placeholder="Default Delievery Address" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="email">Phone number</label>
                    <div class="input-with-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="tel" id="email" class="form-control" placeholder="Enter your phone number" required>
                    </div>
                </div>

                

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" class="form-control" placeholder="Enter your password"
                            required>
                    </div>
                </div>

                <button type="submit" class="submit-btn hero--btn">Sign Up</button>

                <div class="signup-link">
                    Already have an account? <a href="./login.html">Sign in here</a>
                </div>
            </form>
        </div>

    </main>
</body>
</html>
