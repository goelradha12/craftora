<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - Craftora | Modern Custom Merchandise</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f2937'/%3E%3Cpath d='M20 24h24l-2 24H22l-2-24Z' fill='%23ffffff'/%3E%3Cpath d='M25 24c0-4 3-8 7-8s7 4 7 8' fill='none' stroke='%23ffffff' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M29 34h6' stroke='%231f2937' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M44 16l1.2 2.8L48 20l-2.8 1.2L44 24l-1.2-2.8L40 20l2.8-1.2L44 16Z' fill='%23f59e0b'/%3E%3C/svg%3E">

    <!-- Legacy shortcut icon -->
    <link rel="shortcut icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f2937'/%3E%3Cpath d='M20 24h24l-2 24H22l-2-24Z' fill='%23ffffff'/%3E%3Cpath d='M25 24c0-4 3-8 7-8s7 4 7 8' fill='none' stroke='%23ffffff' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M29 34h6' stroke='%231f2937' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M44 16l1.2 2.8L48 20l-2.8 1.2L44 24l-1.2-2.8L40 20l2.8-1.2L44 16Z' fill='%23f59e0b'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin="">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link rel="stylesheet" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lato:wght@400;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    
    <link rel="stylesheet" href="./styles/tokens.css">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <main class="login">

        <div class="login--image">
            <img loading="lazy" src="./assets/t-shirt_blue_person.webp" alt="Signup Banner" width="600" height="800">
        </div>

        <div class="login--form">

            <a href="./index.html" class="logo-link">
                <img src="./assets/logo.webp" alt="Craftora Logo" class="logo-loginPage" width="116" height="24">
            </a>

            <h2 class="section-heading">Signup</h2>

            <div class="form-error-banner" id="signupError" role="alert" hidden>
                <i class="fas fa-circle-exclamation" aria-hidden="true"></i>
                <span id="signupErrorMsg"></span>
            </div>

            <form id="signupForm" novalidate>
                <div class="signup-section">
                    <h3 class="checkout-modal__section-title">Account Information</h3>
                    <div class="form-row-2">
                        <div class="form-group">
                            <label for="fullname" class="required">Full Name</label>
                            <div class="input-with-icon">
                                <i class="fas fa-user" aria-hidden="true"></i>
                                <input type="text" id="fullname" name="fullname" class="form-control"
                                    placeholder="Your full name" autocomplete="name" required>
                            </div>
                            <span class="field-error" id="nameError"></span>
                        </div>

                        <div class="form-group">
                            <label for="phone" class="required">Phone Number</label>
                            <div class="input-with-icon">
                                <i class="fas fa-phone" aria-hidden="true"></i>
                                <input type="tel" id="phone" name="phone" class="form-control" placeholder="10-digit number"
                                    autocomplete="tel" inputmode="numeric" maxlength="10" required>
                            </div>
                            <span class="field-error" id="phoneError"></span>
                        </div>
                    </div>

                    <div class="form-row-2">
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <div class="input-with-icon">
                                <i class="fas fa-envelope" aria-hidden="true"></i>
                                <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email"
                                    autocomplete="email">
                            </div>
                            <span class="field-error" id="emailError"></span>
                        </div>

                        <div class="form-group">
                            <label for="password" class="required">Password</label>
                            <div class="input-with-icon">
                                <i class="fas fa-lock" aria-hidden="true"></i>
                                <input type="password" id="password" name="password" class="form-control"
                                    placeholder="Min. 6 characters" autocomplete="new-password" required>
                                <button type="button" class="eye-toggle" id="togglePassword" aria-label="Show password">
                                    <i class="fas fa-eye" id="eyeIcon" aria-hidden="true"></i>
                                </button>
                            </div>
                            <span class="field-error" id="passwordError"></span>
                        </div>
                    </div>

                    <div class="pw-strength" aria-live="polite">
                        <div class="pw-strength__bar">
                            <div class="pw-strength__fill" id="pwFill"></div>
                        </div>
                        <span class="pw-strength__label" id="pwLabel"></span>
                    </div>
                </div>

                <div class="signup-section accordion-section">
                    <button type="button" class="accordion-toggle" id="deliveryToggle" aria-expanded="false">
                        <h3 class="checkout-modal__section-title" style="margin: 0;">Delivery Information</h3>
                        <i class="fas fa-chevron-down accordion-icon" aria-hidden="true"></i>
                    </button>
                    
                    <div class="accordion-content" id="deliveryContent">
                        <div class="form-row-2">
                            <div class="form-group">
                                <label for="house">Apartment / House Number</label>
                                <div class="input-with-icon">
                                    <i class="fas fa-home" aria-hidden="true"></i>
                                    <input type="text" id="house" name="house" class="form-control" placeholder="Flat 101, Building Name">
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="street">Street / Area</label>
                                <div class="input-with-icon">
                                    <i class="fas fa-road" aria-hidden="true"></i>
                                    <input type="text" id="street" name="street" class="form-control" placeholder="Main Street, Area">
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="landmark">Landmark</label>
                            <div class="input-with-icon">
                                <i class="fas fa-map-marker-alt" aria-hidden="true"></i>
                                <input type="text" id="landmark" name="landmark" class="form-control" placeholder="Near park, Behind school">
                            </div>
                        </div>

                        <div class="form-row-3">
                            <div class="form-group">
                                <label for="city">City</label>
                                <div class="input-with-icon">
                                    <i class="fas fa-city" aria-hidden="true"></i>
                                    <input type="text" id="city" name="city" class="form-control" placeholder="City name">
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="state">State</label>
                                <div class="input-with-icon">
                                    <i class="fas fa-map" aria-hidden="true"></i>
                                    <input type="text" id="state" name="state" class="form-control" placeholder="State name">
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="pincode">Pincode</label>
                                <div class="input-with-icon">
                                    <i class="fas fa-thumbtack" aria-hidden="true"></i>
                                    <input type="text" id="pincode" name="pincode" class="form-control" placeholder="6-digit pincode" inputmode="numeric" maxlength="6">
                                </div>
                                <span class="field-error" id="pincodeError"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <button type="submit" class="submit-btn hero--btn" id="signupBtn" style="margin-top: var(--space-4);">
                    <span class="btn-text">Sign Up</span>
                    <i class="fas fa-spinner fa-spin btn-spinner" aria-hidden="true"></i>
                </button>

                <div class="signup-link">
                    Already have an account?
                    <a href="./login.html">Sign in here</a>
                </div>
            </form>

        </div>

    </main>

    <script defer src="./scripts/auth.js"></script>
    <script>
        const _signupParams = new URLSearchParams(window.location.search);
        const _signupRedirect = _signupParams.get('redirect') || './index.html';

        const _loginLink = document.querySelector('a[href="./login.html"]');
        if (_loginLink && _signupParams.get('redirect')) {
            _loginLink.href = `./login.html?redirect=${encodeURIComponent(_signupParams.get('redirect'))}`;
        }

        document.getElementById('togglePassword').addEventListener('click', () => {
            const input = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            icon.className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
            document.getElementById('togglePassword').setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        });

        document.getElementById('password').addEventListener('input', () => {
            const val = document.getElementById('password').value;
            const fill = document.getElementById('pwFill');
            const label = document.getElementById('pwLabel');
            let score = 0;
            if (val.length >= 6) score++;
            if (val.length >= 10) score++;
            if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
            if (/\d/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;

            const levels = ['', 'Weak', 'Fair', 'Good', 'Strong', 'Very strong'];
            const colors = ['', '#ef4444', '#f97316', '#eab308', '#22c55e', '#10b981'];
            const widths = ['0%', '20%', '40%', '60%', '80%', '100%'];

            fill.style.width = val.length ? widths[score] : '0%';
            fill.style.background = colors[score];
            label.textContent = val.length ? levels[score] : '';
            label.style.color = colors[score];
        });

        const deliveryToggle = document.getElementById('deliveryToggle');
        const deliveryContent = document.getElementById('deliveryContent');
        if (deliveryToggle && deliveryContent) {
            deliveryToggle.addEventListener('click', () => {
                const isExpanded = deliveryToggle.getAttribute('aria-expanded') === 'true';
                deliveryToggle.setAttribute('aria-expanded', !isExpanded);
                if (!isExpanded) {
                    deliveryContent.classList.add('show');
                } else {
                    deliveryContent.classList.remove('show');
                }
            });
        }

        document.getElementById('signupForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const name = document.getElementById('fullname').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            
            const house = document.getElementById('house').value.trim();
            const street = document.getElementById('street').value.trim();
            const landmark = document.getElementById('landmark').value.trim();
            const city = document.getElementById('city').value.trim();
            const state = document.getElementById('state').value.trim();
            const pincode = document.getElementById('pincode').value.trim();

            const errorDiv = document.getElementById('signupError');
            const errorMsg = document.getElementById('signupErrorMsg');
            const btn = document.getElementById('signupBtn');

            errorDiv.hidden = true;
            ['nameError', 'emailError', 'phoneError', 'passwordError', 'pincodeError'].forEach(id => {
                if (document.getElementById(id)) document.getElementById(id).textContent = '';
            });

            let valid = true;
            if (!name) { document.getElementById('nameError').textContent = 'Full name is required.'; valid = false; }
            
            if (email) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    document.getElementById('emailError').textContent = 'Please enter a valid email format.';
                    valid = false;
                }
            }

            if (!phone) {
                document.getElementById('phoneError').textContent = 'Phone number is required.';
                valid = false;
            } else if (phone.replace(/\\D/g, '').length < 10) {
                document.getElementById('phoneError').textContent = 'Please enter a valid 10-digit number.';
                valid = false;
            }

            if (!password) { document.getElementById('passwordError').textContent = 'Password is required.'; valid = false; }
            else if (password.length < 6) {
                document.getElementById('passwordError').textContent = 'Password must be at least 6 characters.';
                valid = false;
            }
            
            if (pincode && !/^\\d{6}$/.test(pincode)) {
                document.getElementById('pincodeError').textContent = 'Please enter a valid 6-digit pincode.';
                valid = false;
            }

            if (!valid) return;

            btn.classList.add('loading');
            btn.disabled = true;

            const addressObj = { house, street, landmark, city, state, pincode };
            const landmarkStr = landmark ? `${landmark}, ` : '';
            // Only generate formatted address if at least some required fields are provided
            let formattedAddress = '';
            if (house || street || city) {
                formattedAddress = [house, street].filter(Boolean).join(', ') + 
                    (landmarkStr ? `, ${landmarkStr}` : (house || street ? ', ' : '')) +
                    [city, state].filter(Boolean).join(', ') + 
                    (pincode ? ` - ${pincode}` : '');
            }

            setTimeout(() => {
                const result = attemptSignup({
                    name,
                    email,
                    phone,
                    address: formattedAddress,
                    addressObj,
                    password
                });

                btn.classList.remove('loading');
                btn.disabled = false;

                if (result.ok) {
                    window.location.href = _signupRedirect;
                } else {
                    errorMsg.textContent = result.error;
                    errorDiv.hidden = false;
                }
            }, 400);
        });
    </script>

</body>

</html>
