<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All products</title>
  <style>
    :root {
      --bg: #f7f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
      --radius: 20px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .page {
      max-width: 1500px;
      margin: 0 auto;
      padding: 24px;
    }

    .header {
      margin-bottom: 18px;
    }

    .header h1 {
      margin: 0 0 6px;
      font-size: 34px;
      letter-spacing: -0.03em;
    }

    .header p {
      margin: 0;
      color: var(--muted);
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr 260px;
      gap: 14px;
      margin-bottom: 18px;
    }

    .search-wrap,
    .category-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      padding: 12px 16px;
      gap: 12px;
    }

    .search-wrap input,
    .category-wrap select {
      border: 0;
      outline: none;
      background: transparent;
      width: 100%;
      font-size: 15px;
      color: var(--text);
    }

    .category-wrap select { appearance: none; }

    .layout {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .filters {
      position: sticky;
      top: 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .filters h2 {
      margin: 0 0 14px;
      font-size: 18px;
    }

    .filter-group {
      margin-bottom: 18px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    .filter-group:last-child {
      border-bottom: 0;
      padding-bottom: 0;
      margin-bottom: 0;
    }

    .filter-group h3 {
      margin: 0 0 12px;
      font-size: 14px;
      color: #111827;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      color: #374151;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }

    .check input { accent-color: #111827; }

    .price-values {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--muted);
      margin-top: 10px;
    }

    .range {
      width: 100%;
      margin-top: 6px;
    }

    .products-area {
      min-width: 0;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .toolbar .count {
      color: var(--muted);
      font-size: 14px;
    }

    .sort-pill {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 14px;
      color: #374151;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow);
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }

    .card {
      position: relative;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 34px rgba(17, 24, 39, 0.12);
    }

    .badge {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 2;
      background: rgba(17, 24, 39, 0.92);
      color: #fff;
      font-size: 12px;
      padding: 7px 10px;
      border-radius: 999px;
    }

    .wishlist {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 2;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.92);
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(0,0,0,0.12);
    }

    .wishlist svg { width: 18px; height: 18px; stroke-width: 2.1; }
    .wishlist.active svg { fill: #ef4444; stroke: #ef4444; }

    .image {
      aspect-ratio: 1 / 1;
      background: #f3f4f6;
      overflow: hidden;
    }

    .image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .content {
      padding: 16px;
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 8px;
    }

    .title {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
      letter-spacing: -0.02em;
    }

    .category {
      display: inline-flex;
      margin-top: 2px;
      font-size: 12px;
      color: #4b5563;
      background: #f3f4f6;
      padding: 6px 9px;
      border-radius: 999px;
    }

    .desc {
      margin: 10px 0 14px;
      color: #4b5563;
      font-size: 14px;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 42px;
    }

    .bottom-row {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-end;
    }

    .price {
      font-size: 18px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 8px;
    }

    .colors {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .swatch {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1px solid rgba(17,24,39,0.12);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.55);
    }

    .stock {
      font-size: 12px;
      color: #6b7280;
      text-align: right;
    }

    .empty {
      background: var(--card);
      border: 1px dashed var(--border);
      border-radius: 24px;
      padding: 32px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 1100px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .filters {
        position: static;
      }
    }

    @media (max-width: 720px) {
      .topbar {
        grid-template-columns: 1fr;
      }

      .page {
        padding: 16px;
      }

      .header h1 {
        font-size: 28px;
      }

      .grid {
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <h1>All products</h1>
      <p>Browse your catalog with search, category, price, featured, and stock filters.</p>
    </header>

    <section class="topbar">
      <div class="search-wrap">
        <span>🔎</span>
        <input id="searchInput" type="text" placeholder="Search products by name, category, or description..." />
      </div>

      <div class="category-wrap">
        <span>⚙️</span>
        <select id="categorySelect">
          <option value="All">All categories</option>
          <option value="Diary">Diary</option>
          <option value="Bottle">Bottle</option>
          <option value="Tshirt">Tshirt</option>
          <option value="Cup">Cup</option>
        </select>
      </div>
    </section>

    <section class="layout">
      <aside class="filters">
        <h2>Filters</h2>

        <div class="filter-group">
          <h3>Category</h3>
          <label class="check"><input type="checkbox" class="categoryCheck" value="Diary" /> Diary</label>
          <label class="check"><input type="checkbox" class="categoryCheck" value="Bottle" /> Bottle</label>
          <label class="check"><input type="checkbox" class="categoryCheck" value="Tshirt" /> Tshirt</label>
          <label class="check"><input type="checkbox" class="categoryCheck" value="Cup" /> Cup</label>
        </div>

        <div class="filter-group">
          <h3>Price</h3>
          <input id="priceRange" class="range" type="range" min="0" max="2000" value="2000" />
          <div class="price-values">
            <span>₹0</span>
            <span id="priceLabel">₹2000</span>
          </div>
        </div>

        <div class="filter-group">
          <h3>More filters</h3>
          <label class="check"><input id="featuredOnly" type="checkbox" /> Featured only</label>
          <label class="check"><input id="inStockOnly" type="checkbox" /> In stock only</label>
        </div>
      </aside>

      <main class="products-area">
        <div class="toolbar">
          <div class="count" id="resultCount">0 products found</div>
          <div class="sort-pill">All Products <span>▾</span></div>
        </div>
        <div id="productGrid" class="grid"></div>
        <div id="emptyState" class="empty" style="display:none;">
          No products match your filters.
        </div>
      </main>
    </section>
  </div>

  <script>
    // Replace window.PRODUCTS with your actual product list if you are loading from another file.
    const products = window.PRODUCTS || [
      {
        id: "P001",
        name: "Minimalist Daily Diary",
        category: "Diary",
        basePrice: 399,
        description: "Premium hardcover diary with smooth pages for daily journaling and planning.",
        colors: ["#000000", "#8B4513", "#FFFFFF"],
        images: { default: "https://images.unsplash.com/photo-1531346878377-a5be20888e57?auto=format&fit=crop&w=1200&q=80" },
        badges: ["Best Seller"],
        featured: true,
        stock: 120
      },
      {
        id: "P002",
        name: "Vintage Leather Diary",
        category: "Diary",
        basePrice: 599,
        description: "Elegant leather-bound diary with a premium feel for notes, planning, and gifting.",
        colors: ["#5C4033", "#000000"],
        images: { default: "https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=1200&q=80" },
        badges: ["Premium"],
        featured: false,
        stock: 85
      },
      {
        id: "P003",
        name: "Eco Steel Bottle",
        category: "Bottle",
        basePrice: 699,
        description: "Insulated stainless steel bottle that keeps drinks cold and hot for hours.",
        colors: ["#1E90FF", "#000000", "#FF4500"],
        images: { default: "https://images.unsplash.com/photo-1523362628745-0c100150b504?auto=format&fit=crop&w=1200&q=80" },
        badges: ["Eco Friendly"],
        featured: true,
        stock: 80
      },
      {
        id: "P004",
        name: "Gradient Gym Bottle",
        category: "Bottle",
        basePrice: 799,
        description: "Stylish gradient gym bottle for daily hydration and workout sessions.",
        colors: ["#FF4500", "#9400D3"],
        images: { default: "https://images.unsplash.com/photo-1526401485004-2aa7f3c7d7ed?auto=format&fit=crop&w=1200&q=80" },
        badges: ["Trending"],
        featured: true,
        stock: 70
      },
      {
        id: "P005",
        name: "Oversized Cotton T-Shirt",
        category: "Tshirt",
        basePrice: 999,
        description: "Comfortable oversized cotton t-shirt with premium print quality and relaxed fit.",
        colors: ["#FFFFFF", "#000000", "#D3D3D3"],
        images: { default: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=1200&q=80" },
        badges: ["Trending"],
        featured: true,
        stock: 150
      },
      {
        id: "P006",
        name: "Full Sleeve Sports Tee",
        category: "Tshirt",
        basePrice: 899,
        description: "Lightweight polyester full sleeve t-shirt designed for active wear and comfort.",
        colors: ["#0000FF", "#222222"],
        images: { default: "https://images.unsplash.com/photo-1503341504253-dff4815485f1?auto=format&fit=crop&w=1200&q=80" },
        badges: ["Sports"],
        featured: false,
        stock: 80
      },
      {
        id: "P007",
        name: "Classic V-Neck Tee",
        category: "Tshirt",
        basePrice: 749,
        description: "Classic V-neck t-shirt with side print customization and a clean everyday look.",
        colors: ["#FFFFFF", "#228B22"],
        images: { default: "https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=1200&q=80" },
        badges: [],
        featured: false,
        stock: 65
      },
      {
        id: "P008",
        name: "Custom Printed Coffee Mug",
        category: "Cup",
        basePrice: 349,
        description: "Ceramic coffee mug with high-quality custom print for daily use or gifting.",
        colors: ["#FFFFFF", "#000000"],
        images: { default: "https://images.unsplash.com/photo-1514228742587-6b1558fcca3d?auto=format&fit=crop&w=1200&q=80" },
        badges: ["Hot"],
        featured: true,
        stock: 300
      },
      {
        id: "P009",
        name: "Magic Color Changing Mug",
        category: "Cup",
        basePrice: 599,
        description: "Heat-sensitive mug that changes color when filled with a hot drink.",
        colors: ["#000000"],
        images: { default: "https://images.unsplash.com/photo-1542556398-95fb5b9f15d7?auto=format&fit=crop&w=1200&q=80" },
        badges: ["Magic"],
        featured: true,
        stock: 75
      },
      {
        id: "P010",
        name: "Couple Theme Mug Set",
        category: "Cup",
        basePrice: 799,
        description: "Cute matching mug set for couples, perfect for gifting and special occasions.",
        colors: ["#FFC0CB", "#87CEFA"],
        images: { default: "https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=1200&q=80" },
        badges: ["Gift Item"],
        featured: true,
        stock: 50
      }
    ];

    const state = {
      search: "",
      category: "All",
      selectedCategories: new Set(),
      featuredOnly: false,
      inStockOnly: false,
      maxPrice: 2000,
      wishlist: new Set()
    };

    const grid = document.getElementById("productGrid");
    const emptyState = document.getElementById("emptyState");
    const resultCount = document.getElementById("resultCount");
    const searchInput = document.getElementById("searchInput");
    const categorySelect = document.getElementById("categorySelect");
    const priceRange = document.getElementById("priceRange");
    const priceLabel = document.getElementById("priceLabel");
    const featuredOnly = document.getElementById("featuredOnly");
    const inStockOnly = document.getElementById("inStockOnly");
    const categoryChecks = [...document.querySelectorAll(".categoryCheck")];

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function money(value) {
      return `₹${Number(value).toLocaleString("en-IN")}`;
    }

    function matchesSearch(product) {
      const q = state.search.trim().toLowerCase();
      if (!q) return true;
      return [product.name, product.category, product.description]
        .join(" ")
        .toLowerCase()
        .includes(q);
    }

    function matchesCategory(product) {
      const topFilter = state.category === "All" || product.category === state.category;
      const sideFilter = state.selectedCategories.size === 0 || state.selectedCategories.has(product.category);
      return topFilter && sideFilter;
    }

    function filteredProducts() {
      return products.filter(product => {
        const priceOk = Number(product.basePrice) <= state.maxPrice;
        const featuredOk = !state.featuredOnly || product.featured;
        const stockOk = !state.inStockOnly || Number(product.stock) > 0;
        return matchesSearch(product) && matchesCategory(product) && priceOk && featuredOk && stockOk;
      });
    }

    function colorSwatches(colors) {
      return (colors || [])
        .slice(0, 5)
        .map(color => `<span class="swatch" title="${escapeHtml(color)}" style="background:${escapeHtml(color)}"></span>`)
        .join("");
    }

    function render() {
      const data = filteredProducts();
      resultCount.textContent = `${data.length} product${data.length === 1 ? "" : "s"} found`;
      priceLabel.textContent = money(state.maxPrice);
      grid.innerHTML = data.map(product => {
        const badgeText = product.badges && product.badges.length ? product.badges[0] : "Product";
        const wishActive = state.wishlist.has(product.id) ? "active" : "";
        return `
          <article class="card">
            <div class="badge">${escapeHtml(badgeText)}</div>
            <button class="wishlist ${wishActive}" aria-label="Add to wishlist" data-wishlist="${escapeHtml(product.id)}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M20.8 4.6c-1.4-1.5-3.7-1.8-5.4-.7-1 .6-1.8 1.6-2.4 2.6-.6-1-1.4-2-2.4-2.6-1.7-1.1-4-.8-5.4.7-1.7 1.8-1.8 4.6-.1 6.5L12 20l6.9-8.9c1.8-1.9 1.7-4.7-.1-6.5z"></path>
              </svg>
            </button>
            <div class="image">
              <img src="${escapeHtml(product.images?.default || 'https://via.placeholder.com/800')}" alt="${escapeHtml(product.name)}" />
            </div>
            <div class="content">
              <div class="title-row">
                <div>
                  <h3 class="title">${escapeHtml(product.name)}</h3>
                  <div class="category">${escapeHtml(product.category)}</div>
                </div>
              </div>
              <p class="desc">${escapeHtml(product.description || "")}</p>
              <div class="bottom-row">
                <div>
                  <div class="price">${money(product.basePrice)}</div>
                  <div class="colors">${colorSwatches(product.colors || [])}</div>
                </div>
                <div class="stock">Stock: ${escapeHtml(product.stock ?? 0)}</div>
              </div>
            </div>
          </article>
        `;
      }).join("");

      emptyState.style.display = data.length ? "none" : "block";

      grid.querySelectorAll("[data-wishlist]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-wishlist");
          if (state.wishlist.has(id)) state.wishlist.delete(id);
          else state.wishlist.add(id);
          render();
        });
      });
    }

    searchInput.addEventListener("input", (e) => {
      state.search = e.target.value;
      render();
    });

    categorySelect.addEventListener("change", (e) => {
      state.category = e.target.value;
      render();
    });

    categoryChecks.forEach(check => {
      check.addEventListener("change", (e) => {
        const value = e.target.value;
        if (e.target.checked) state.selectedCategories.add(value);
        else state.selectedCategories.delete(value);
        render();
      });
    });

    priceRange.addEventListener("input", (e) => {
      state.maxPrice = Number(e.target.value);
      render();
    });

    featuredOnly.addEventListener("change", (e) => {
      state.featuredOnly = e.target.checked;
      render();
    });

    inStockOnly.addEventListener("change", (e) => {
      state.inStockOnly = e.target.checked;
      render();
    });

    render();
  </script>
</body>
</html>
